name: Bug report
description: Report a reproducible Spherical Graph problem.
title: "[Bug]: "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Do not attach private notes or a real vault. Use anonymized data or the synthetic vault generator.
              Report vulnerabilities privately through the Security tab.
    - type: input
      id: plugin-version
      attributes:
          label: Plugin version
          placeholder: 1.0.0
      validations:
          required: true
    - type: input
      id: obsidian-version
      attributes:
          label: Obsidian version
          placeholder: 1.12.7
      validations:
          required: true
    - type: input
      id: operating-system
      attributes:
          label: Operating system
          placeholder: Windows 11, macOS 15, Ubuntu 24.04
      validations:
          required: true
    - type: input
      id: vault-size
      attributes:
          label: Approximate vault size
          description: Number of Markdown notes and, if known, resolved links.
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: Describe the observed and expected behavior.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction steps
          description: Provide the smallest reliable sequence.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant errors
          description: Include only relevant, redacted console errors.
          render: text
